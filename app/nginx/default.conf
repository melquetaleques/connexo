# Exemplo para deploy com API + frontend estático.
# Ajuste server_name, certificados e upstreams.

upstream connexo_api {
  server 127.0.0.1:8080;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://connexo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://connexo_api/health;
  }

  location / {
    root /var/www/connexo/web;
    try_files $uri $uri/ /index.html;
  }
}
